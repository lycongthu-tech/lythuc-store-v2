<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lý Thức Store V2</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
            background-color: #f5f5f5; 
        }

        .header-container {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }

        .admin-link {
            position: absolute;
            right: 10px;
            top: 0;
            color: #666;
            text-decoration: none;
            font-size: 13px;
        }
        .admin-link:hover { text-decoration: underline; }

        /* Hiệu ứng bong bóng Zalo tự bay nhấp nhô */
        .zalo-bubble {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            animation: floatAnimation 3s ease-in-out infinite;
            transition: transform 0.3s ease;
        }

        .zalo-bubble:hover {
            transform: scale(1.1) rotate(5deg);
        }

        @keyframes floatAnimation {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
            gap: 20px; 
            margin-top: 20px; 
        }

        .grid-container > div {
            animation: fadeInProduct 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes fadeInProduct {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .product-card { 
            background: #fff; 
            padding: 15px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            text-align: center; 
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .product-card img { 
            width: 100%; 
            height: 280px; 
            object-fit: cover; 
            border-radius: 4px; 
        }

        .price { 
            color: #dc2626; 
            font-weight: bold; 
            font-size: 18px; 
            margin: 10px 0; 
        }

        .buy-btn { 
            display: inline-block; 
            background: #fe2c55; 
            color: white; 
            padding: 8px 15px; 
            text-decoration: none; 
            border-radius: 4px; 
            font-weight: bold; 
            transition: background 0.2s;
        }

        .buy-btn:hover { background: #e02447; }
    </style>
</head>
<body>

    <div class="header-container">
        <a href="/login" class="admin-link">Quản trị Admin</a>
        <h1 style="color: #333; margin-bottom: 5px;">LÝ THỨC STORE V2</h1>
        <p style="color: #666; margin: 0;">Dữ liệu tải trực tiếp từ Cơ sở dữ liệu SQLite</p>
    </div>

    <div class="grid-container">
        {% for sp in san_pham %}
        <div class="product-card">
            <img src="{{ sp.anh }}" alt="{{ sp.ten }}">
            <h3 style="font-size: 15px; height: 40px; overflow: hidden; color: #1f2937; margin: 10px 0;">{{ sp.ten }}</h3>
            <p class="price">{{ sp.gia }}</p>
            <a href="{{ sp.link_affiliate }}" target="_blank" class="buy-btn">MUA TRÊN TIKTOK SHOP</a>
        </div>
        {% endfor %}
    </div>

</body>
</html>
