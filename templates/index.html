<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lý Thức Store V2 - Database</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background-color: #f5f5f5; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .product-card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .product-card img { width: 100%; height: 280px; object-fit: cover; border-radius: 4px; }
        .price { color: #dc2626; font-weight: bold; font-size: 18px; margin: 10px 0; }
        .buy-btn { display: inline-block; background: #fe2c55; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <h1 style="text-align: center; color: #333;">LÝ THỨC STORE V2</h1>
    <p style="text-align: center; color: #666;">Dữ liệu tải trực tiếp từ Cơ sở dữ liệu SQLite</p>

    <div class="grid-container">
        <!-- Vòng lặp duyệt qua danh sách sản phẩm lấy từ Database -->
        {% for sp in san_pham %}
        <div class="product-card">
            <img src="{{ sp.anh }}" alt="{{ sp.ten }}">
            <h3 style="font-size: 15px; height: 40px; overflow: hidden; color: #1f2937; margin: 10px 0;">{{ sp.ten }}</h3>
            <p class="price">{{ sp.gia }}</p>
            <a href="{{ sp.link_affiliate }}" target="_blank" class="buy-btn">MUA TRÊN TIKTOK SHOP</a>
        </div>
        {% endfor %}
    </div>

</body>
</html>
